[BitTorrent]
Session\DefaultSavePath=/var/lib/cinemate/downloads
Session\TempPath=/var/lib/cinemate/downloads/.incomplete
Session\TempPathEnabled=true
Session\Preallocation=false
# Queueing is what parked torrents in queuedDL and stalled streaming on the
# shared instance. The bridge caps concurrency itself via MAX_ACTIVE_TORRENTS.
Session\QueueingSystemEnabled=false
# Never remove a torrent on a seeding limit. Deletion is the bridge's decision.
Session\GlobalMaxRatio=-1
Session\MaxRatioAction=0
Session\DHTEnabled=true
Session\PeXEnabled=true
Session\LSDEnabled=true

[Preferences]
# Loopback only. Combined with LocalHostAuth=false the bridge connects without
# credentials, and the WebUI is unreachable from outside the host.
WebUI\Address=127.0.0.1
WebUI\Port=18081
WebUI\LocalHostAuth=false
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
Downloads\SavePath=/var/lib/cinemate/downloads
Downloads\TempPath=/var/lib/cinemate/downloads/.incomplete
Downloads\TempPathEnabled=true
Downloads\PreAllocation=false
